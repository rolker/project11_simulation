repos:
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-quotes==3.4.0
          - flake8-import-order==0.18.2
          - flake8-docstrings==1.6.0
          - flake8-builtins==2.1.0
        args: ['--config=.flake8']
