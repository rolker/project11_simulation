# Nav2 parameters for simulation tests.
# Based on ben_project11/config/nav2_params.yaml with reduced costmap
# dimensions to avoid OOM in test environments.

bt_task_navigator:
  ros__parameters:
    global_frame: <tf_prefix>/map
    robot_base_frame: <tf_prefix>/base_link
    odom_topic: <robot_namespace>/odom
    bt_loop_duration: 500
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["run_tasks",]
    run_tasks:
      plugin: "marine_nav_bt_task_navigator::TaskNavigator"
      debug: false

    plugin_lib_names:
      - marine_nav_behavior_tree_bt_plugins

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - hover_error_code


controller_server:
  ros__parameters:
    controller_frequency: 5.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    enable_stamped_cmd_vel: true

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 4.5
      yaw_goal_tolerance: 5.0

    FollowPath:
      plugin: "marine_nav_crabbing_path_follower::CrabbingPathFollower"
      default_speed: 2.75
      visualization: true
      pid:
        upper_limit: 90.0
        lower_limit: -90.0
        windup_limit: 50.0
        kp: 6.0
        ki: 0.5
        kd: 0.6


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: <tf_prefix>/odom
      robot_base_frame: <tf_prefix>/base_link
      rolling_window: true
      width: 200
      height: 200
      resolution: 0.5
      footprint: "[[2.65, 0], [2.6, 0.1], [2.4, 0.4], [1.9, 0.6], [1.0, 0.85], [-1.3, 0.85], [-1.35, 0.4], [-1.6, 0.35], [-1.6, -0.35], [-1.35, -0.4], [-1.3, -0.85], [1.0, -0.85], [1.9, -0.6], [2.4, -0.4], [2.6, -0.1], [2.65, 0]]"
      plugins: ["chart_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.05
        inflation_radius: 150.0
      chart_layer:
        plugin: "s57_layer::S57Layer"
        enabled: True
        minimum_depth: 1.0
        maximum_caution_depth: 2.5
        overhead_clearance: 5.0
        update_timeout: 0.15
        s57_grids_namespace: <robot_namespace>/s57

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: <tf_prefix>/map
      robot_base_frame: <tf_prefix>/base_link
      robot_radius: 3.0
      footprint: "[[2.65, 0], [2.6, 0.1], [2.4, 0.4], [1.9, 0.6], [1.0, 0.85], [-1.3, 0.85], [-1.35, 0.4], [-1.6, 0.35], [-1.6, -0.35], [-1.35, -0.4], [-1.3, -0.85], [1.0, -0.85], [1.9, -0.6], [2.4, -0.4], [2.6, -0.1], [2.65, 0]]"
      resolution: 1.0
      track_unknown_space: true
      rolling_window: true
      width: 500
      height: 500
      plugins: ["chart_layer", "inflation_layer"]
      chart_layer:
        plugin: "s57_layer::S57Layer"
        enabled: True
        minimum_depth: 1.0
        maximum_caution_depth: 2.5
        overhead_clearance: 5.0
        update_timeout: 0.75
        s57_grids_namespace: <robot_namespace>/s57
        get_datasets_service: <robot_namespace>/s57/get_datasets
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.05
        inflation_radius: 150.0
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 5.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 1.5
      allow_primitive_interpolation: true
      allow_unknown: true
      change_penalty: 0.5
      cost_penalty: 10.0
      minimum_turning_radius: 5.0
      debug_visualizations: false
      max_iterations: -1
      max_on_approach_iterations: -1
      max_planning_time: 5.0
      analytic_expansion_max_length: 25.0
      angle_quantization_bins: 72
      lookup_table_size: 55.0
      non_straight_penalty: 1.1
      use_quadratic_cost_penalty: false


smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait", "hover"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    hover:
      plugin: "marine_nav_behaviors::Hover"
      minimum_radius: 10.0
      maximum_radius: 25.0
      maximum_speed: 1.0
      minimum_speed: 0.15
      maximum_rotation_speed: 1.5
      deceleration: -0.45
      generate_visualization: true

    local_frame: <tf_prefix>/odom
    global_frame: <tf_prefix>/map
    robot_base_frame: <tf_prefix>/base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: true

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [2.75, 0.0, 0.45]
    min_velocity: [-0.5, 0.0, -0.45]
    max_accel: [0.8, 0.0, 0.2]
    max_decel: [-0.45, 0.0, -0.2]
    odom_topic: <robot_namespace>/odom
    odom_duration: 0.5
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: <tf_prefix>/odom
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "piloting_mode/autonomous/cmd_vel"
    enable_stamped_cmd_vel: true
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: <tf_prefix>/base_link
    fixed_frame: <tf_prefix>/odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
