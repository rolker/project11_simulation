# Portsmouth Harbor to Isles of Shoals region parameters
# Covers from Memorial Bridge south to the Isles of Shoals
bounds:
  south: 42.942
  west: -70.76
  north: 43.085
  east: -70.565

world_name: portsmouth_nh_portsmouth_to_isles

# Heightmap grid: 2^grid_power + 1 (9 = 513x513)
grid_power: 9

# Optional: path to S57 ENC data directory.
# Set ROS_S57_ENC_ROOT env var or override here.
# enc_root: /path/to/ENC_ROOT
