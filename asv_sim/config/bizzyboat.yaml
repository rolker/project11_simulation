asv_sim:
  ros__parameters:
    platforms.bizzy.model: echoboat240
    # BizzyBoat reports nav in base_link (mavros child_frame_id; no separate
    # motion_sensor frame in the URDF), so the sim nav is stamped there too.
    platforms.bizzy.mru_frame: bizzy/base_link

    # Lake Massabesic — last recorded pose from the 2026-06-12 deployment
    # (mavros/global_position/global + SBG gps_hdt true heading, end of bag).
    # start_heading is compass-true degrees (platform.py: yaw = 90 - heading).
    platforms.bizzy.start_lat: 42.99055860
    platforms.bizzy.start_lon: -71.39295800
    platforms.bizzy.start_heading: 353.6

    # No current in the sim (Roland) — these are global asv_sim environment
    # params (not per-platform); loading this file zeroes the current.
    environment.current.speed: 0.0
    environment.current.noise.speed: 0.0

    # Lake Massabesic datum — a freshwater lake, not a tidal harbor. The
    # asv_sim Environment defaults to Portsmouth Harbor (ellipsoid_to_mllw
    # -28.104, msl_above_mllw 1.43, M2/N2/S2 tide), and the Massabesic launch
    # doesn't load environment.yaml, so without these overrides the lake
    # surface would sit at the wrong height and swing ~±1.5 m with a phantom
    # tide. Zero the tidal harmonics (no tide on a lake) and fold the whole
    # static height into ellipsoid_to_mllw so getEllipsoidalAltitude() returns
    # a constant 48.88 m — the full-pool WGS84 ellipsoidal water-surface height.
    # This is the single source of truth defined for the real boat in
    # unh_echoboats_project11/bizzyboat_project11/config/massabesic_datum_polygons.yaml
    # (chart_datum_z: 48.88); the sim must match it so z(map_tide) — consumed by
    # the datum chain for costmap alignment / bathy clearance — agrees with the
    # field. (Cross-checked: the NH GRANIT contour chart prior and the M3 survey
    # draft agree to ~4 cm in mean ellipsoidal height at this datum.)
    environment.tide.constituents.amplitudes: [0.0, 0.0, 0.0]
    environment.tide.ellipsoid_to_mllw: 48.88
    environment.tide.msl_above_mllw: 0.0
