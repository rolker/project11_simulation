wamv_camera:
    - name: front_camera
      visualize: False
      x: 0.75
      y: 0.0
      z: 1.5
      R: 0.0
      P: ${radians(15)}
      Y: 0.0
      post_Y: 0.0
    - name: left_camera
      visualize: False
      x: 0.65
      y: 0.4
      z: 1.5
      R: 0.0
      P: ${radians(15)}
      Y: ${radians(65)}
      post_Y: 0.0
    - name: right_camera
      visualize: False
      x: 0.65
      y: -0.4
      z: 1.5
      R: 0.0
      P: ${radians(15)}
      Y: ${radians(-65)}
      post_Y: 0.0
wamv_gps:
    - name: gps_wamv
      x: -0.85
      y: 0.0
      z: 1.3
      R: 0.0
      P: 0.0
      Y: 0.0
wamv_imu:
    - name: imu_wamv
      x: 0.3
      y: -0.2
      z: 1.3
      R: 0.0
      P: 0.0
      Y: 0.0
lidar:
    - name: lidar_wamv
      type: 16_beam
      x: 0.7
      y: 0.0
      z: 1.8
      R: 0.0
      P: ${radians(8)}
      Y: 0.0
      post_Y: 0.0
wamv_ball_shooter:
    - name: ball_shooter
      x: 0.55 
      y: -0.3 
      z: 1.3
      pitch: ${radians(-20)}
      yaw: 0.0
wamv_pinger:
    - sensor_name: receiver
      position: 1.0 0 -1.0
wamv_bathymetric_multibeam_sonar:
    - name: bathymetric_multibeam_sonar
      x: 0.0
      y: 0.0
      z: -0.3
      R: 0.0
      P: ${radians(90.0)}
      Y: 0.0
      update_rate: 2.0
      beam_count: 256
      range_min: 0.5
      range_max: 50.0
      angle_min: ${radians(-60)}
      angle_max: ${radians(60)}
      sonar_frequency: 200000.0
      sound_speed: 1500.0
